<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数值实验台 · 分层裁剪 / 噪声聚合 / 层级缩放</title>
<style>
:root{
  --bg:#0f1420; --panel:#171e2e; --panel2:#1e2740; --line:#2b3650;
  --text:#e6ebf5; --muted:#93a0b8; --accent:#5b9dff; --ok:#3fd17f;
  --warn:#ffb454; --err:#ff6b6b; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:16px 22px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;background:var(--panel)}
header h1{font-size:17px;margin:0}
header .sub{color:var(--muted);font-size:12.5px}
main{max-width:1180px;margin:0 auto;padding:18px 22px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.card h2{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.card h2 .hint{font-weight:400;color:var(--muted);font-size:12px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
  color:var(--text);padding:7px 9px;font-family:var(--mono);font-size:13px}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input.bad{border-color:var(--err)}
button{background:var(--accent);color:#08111f;border:0;border-radius:7px;padding:7px 14px;
  font-weight:600;cursor:pointer;font-size:13px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.small{padding:3px 9px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:right;vertical-align:middle}
th{background:var(--panel2);color:var(--muted);font-weight:600;white-space:nowrap}
th.lab,td.lab{text-align:left;color:var(--muted)}
td input{padding:4px 6px;font-size:12px}
#banner{display:none;margin-bottom:14px;padding:10px 14px;border-radius:8px;
  background:rgba(255,107,107,.12);border:1px solid var(--err);color:#ffc4c4}
#banner.ok{background:rgba(63,209,127,.1);border-color:var(--ok);color:#b8f2d0}
.tbl-wrap{overflow-x:auto}
.kpi{display:inline-block;margin-right:18px;font-size:12.5px;color:var(--muted)}
.kpi b{color:var(--text);font-family:var(--mono)}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.clip{border-color:var(--warn);color:var(--warn)}
.vec{font-family:var(--mono);font-size:12px;color:#c7d3ea}
.small-note{color:var(--muted);font-size:12px;margin-top:6px}
#status{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>数值实验台</h1>
  <span class="sub">多客户端更新 · 分层欧氏裁剪 · 高斯噪声聚合 · 层级范数缩放（纯本地 CPU，无外部服务）</span>
</header>
<main>
  <div id="banner"></div>

  <section class="card">
    <h2>全局参数 <span class="hint">任意修改都会用当前种子整体重算，统计不会与旧种子混用</span></h2>
    <div class="grid">
      <div><label>随机种子 seed</label><input id="seed" type="number" step="1" value="42"></div>
      <div><label>噪声标准差 σ（所有层/客户端同一值）</label><input id="noiseStd" type="number" step="0.1" value="0.5"></div>
      <div><label>重复次数 R</label><input id="repeats" type="number" step="1" min="1" value="20"></div>
      <div><label>总裁剪预算 B（正）</label><input id="budget" type="number" step="0.5" value="6"></div>
      <div><label>预算分配方式</label>
        <select id="allocMode">
          <option value="equal">按层数均分：b_i = B/√L</option>
          <option value="dim_proportional">预算平方正比维数：b_i = B·√(d_i/Σd)</option>
        </select>
      </div>
      <div><label>缩放系数上限 cap（正）</label><input id="scaleCap" type="number" step="0.5" value="10"></div>
      <div><label>零聚合范数回退系数（≥0）</label><input id="scaleFallback" type="number" step="0.1" value="0.5"></div>
    </div>
  </section>

  <section class="card">
    <h2>层参数 <span class="hint">名称、维数与参数向量（逗号分隔，长度须等于维数）</span></h2>
    <div class="tbl-wrap"><table id="layerTable">
      <thead><tr><th class="lab">#</th><th class="lab">层名</th><th>维数 d</th><th>参数向量 θ</th><th>‖θ‖</th><th></th></tr></thead>
      <tbody></tbody>
    </table></div>
    <div class="row" style="margin-top:10px">
      <button class="ghost small" id="addLayer">＋ 添加层</button>
      <span class="small-note">修改维数后请同步参数与各客户端更新长度。</span>
    </div>
  </section>

  <section class="card">
    <h2>客户端更新 <span class="hint">每个客户端为每层提供一个更新向量</span></h2>
    <div class="tbl-wrap"><table id="clientTable">
      <thead id="clientHead"></thead>
      <tbody></tbody>
    </table></div>
    <div class="row" style="margin-top:10px">
      <button class="ghost small" id="addClient">＋ 添加客户端</button>
      <span class="small-note">空客户端集合会被拒绝并保留上次有效结果。</span>
    </div>
  </section>

  <section class="card">
    <h2>结果
      <span class="spacer"></span>
      <span id="status"></span>
    </h2>
    <div id="budgets" class="small-note" style="margin-bottom:10px"></div>
    <div id="results"></div>
  </section>
</main>
<script>
"use strict";

const state = {
  layers: [
    {name: "fc1", dim: 2, params: [3, 4]},
    {name: "fc2", dim: 1, params: [2]}
  ],
  clients: [
    {updates: [[1, 2], [1]]},
    {updates: [[3, 4], [-3]]}
  ],
  lastGood: null
};

const $ = (id) => document.getElementById(id);
const fmt = (x, d=4) => {
  if (!Number.isFinite(x)) return String(x);
  if (Math.abs(x) >= 1e4 || (Math.abs(x) < 1e-4 && x !== 0)) return x.toExponential(3);
  return Number(x.toFixed(d)).toString();
};
const fmtVec = (v, d=4) => "[" + v.map(x => fmt(x, d)).join(", ") + "]";

function parseVec(text, dim, label) {
  const parts = text.split(",").map(s => s.trim()).filter(s => s.length > 0);
  if (parts.length !== dim) {
    throw new Error(`${label} 需要 ${dim} 个数，实际 ${parts.length} 个`);
  }
  const out = [];
  for (const p of parts) {
    const v = Number(p);
    if (!Number.isFinite(v)) throw new Error(`${label} 含非有限数值：“${p}”`);
    out.push(v);
  }
  return out;
}

function renderLayers() {
  const tb = $("layerTable").querySelector("tbody");
  tb.innerHTML = "";
  state.layers.forEach((L, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="lab">${i + 1}</td>
      <td><input value="${L.name}" data-k="name" data-i="${i}"></td>
      <td><input type="number" min="1" step="1" value="${L.dim}" data-k="dim" data-i="${i}" style="width:70px"></td>
      <td><input value="${L.params.join(", ")}" data-k="params" data-i="${i}" style="min-width:220px"></td>
      <td>${fmt(Math.hypot(...L.params))}</td>
      <td><button class="ghost small" data-del-layer="${i}">删除</button></td>`;
    tb.appendChild(tr);
  });
  tb.oninput = (e) => {
    const t = e.target, i = +t.dataset.i;
    if (t.dataset.k === "name") state.layers[i].name = t.value;
    else if (t.dataset.k === "dim") state.layers[i].dim = Math.max(1, (+t.value || 1));
    else if (t.dataset.k === "params") {
      try { state.layers[i].params = parseVec(t.value, state.layers[i].dim, `层 ${i+1} 参数`); t.classList.remove("bad"); }
      catch (err) { t.classList.add("bad"); }
    }
    renderClients();
    schedule();
  };
  tb.onclick = (e) => {
    if (e.target.dataset.delLayer != null) {
      const i = +e.target.dataset.delLayer;
      state.layers.splice(i, 1);
      state.clients.forEach(c => c.updates.splice(i, 1));
      renderAll();
    }
  };
}

function renderClients() {
  const Ls = state.layers;
  const head = $("clientHead");
  head.innerHTML = `<tr><th class="lab">客户端</th>${Ls.map((L, i) =>
    `<th>层 ${i+1}「${L.name}」更新 (d=${L.dim})</th>`).join("")}<th></th></tr>`;
  const tb = $("clientTable").querySelector("tbody");
  tb.innerHTML = "";
  state.clients.forEach((c, ci) => {
    while (c.updates.length < Ls.length) {
      c.updates.push(Array(Ls[c.updates.length]?.dim ?? 1).fill(0));
    }
    while (c.updates.length > Ls.length) c.updates.pop();
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="lab">C${ci+1}</td>` +
      Ls.map((L, li) => {
        const vec = (c.updates[li] && c.updates[li].length === L.dim)
          ? c.updates[li] : Array(L.dim).fill(0);
        c.updates[li] = vec;
        return `<td><input data-ci="${ci}" data-li="${li}" value="${vec.join(", ")}" style="min-width:170px"></td>`;
      }).join("") +
      `<td><button class="ghost small" data-del-client="${ci}">删除</button></td>`;
    tb.appendChild(tr);
  });
  tb.oninput = (e) => {
    const t = e.target;
    if (t.dataset.ci == null) return;
    const ci = +t.dataset.ci, li = +t.dataset.li, dim = state.layers[li].dim;
    try {
      state.clients[ci].updates[li] = parseVec(t.value, dim, `客户端 ${ci+1} 层 ${li+1}`);
      t.classList.remove("bad");
    } catch (err) { t.classList.add("bad"); }
    schedule();
  };
  tb.onclick = (e) => {
    if (e.target.dataset.delClient != null) {
      state.clients.splice(+e.target.dataset.delClient, 1);
      renderClients(); schedule();
    }
  };
}

function collectRequest() {
  return {
    seed: Math.trunc(Number($("seed").value) || 0) >>> 0,
    noise_std: Number($("noiseStd").value),
    repeats: Math.max(1, Math.trunc(Number($("repeats").value) || 1)),
    budget: Number($("budget").value),
    alloc_mode: $("allocMode").value,
    scale_cap: Number($("scaleCap").value),
    scale_fallback: Number($("scaleFallback").value),
    layers: state.layers.map(L => ({name: L.name, dim: L.dim, params: L.params})),
    clients: state.clients.map(c => c.updates)
  };
}

function showError(msg) {
  const b = $("banner");
  b.textContent = "已拒绝本次修改，继续显示上次有效结果：" + msg;
  b.className = ""; b.style.display = "block";
}

async function runCompute() {
  $("status").textContent = "计算中…";
  let req;
  try { req = collectRequest(); }
  catch (e) { showError(e.message); $("status").textContent = "等待合法输入"; return; }
  try {
    const r = await fetch("/api/compute", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(req)
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
    state.lastGood = {req, data};
    const b = $("banner"); b.style.display = "none";
    renderResults(req, data);
    $("status").textContent = "已用当前参数整体重算完成";
  } catch (e) {
    showError(e.message);
    $("status").textContent = "保留上次有效显示";
  }
}

function renderResults(req, data) {
  $("budgets").innerHTML = "各层裁剪预算 b_i = " +
    data.budgets.map((b, i) => `层${i+1}:<b style="color:var(--text)">${fmt(b)}</b>`).join("　") +
    `　（Σb_i² = ${fmt(data.budgets.reduce((s,b)=>s+b*b,0))}，B² = ${fmt(req.budget*req.budget)}）`;
  const host = $("results");
  host.innerHTML = "";
  data.layers.forEach(L => {
    const div = document.createElement("div");
    div.className = "card";
    div.style.background = "var(--panel2)";
    const clipPill = L.clipped_fraction > 0
      ? `<span class="pill clip">被裁剪客户端比例 ${fmt(L.clipped_fraction,2)} = ${L.clipped.filter(Boolean).length}/${L.clipped.length}</span>`
      : `<span class="pill">无客户端被裁剪</span>`;
    div.innerHTML = `
      <h2>层 ${L.index+1}「${L.name}」 <span class="hint">d=${L.dim}，b=${fmt(L.budget)}</span></h2>
      <div style="margin-bottom:8px">${clipPill}</div>
      <div class="tbl-wrap"><table>
        <thead><tr><th class="lab">客户端</th><th>裁剪前 ‖u‖</th><th>裁剪后 ‖clip(u)‖</th><th>是否裁剪</th></tr></thead>
        <tbody>${L.clipped.map((was,c)=>`<tr>
          <td class="lab">C${c+1}</td><td>${fmt(L.pre_norms[c])}</td><td>${fmt(L.post_norms[c])}</td>
          <td style="color:${was?"var(--warn)":"var(--ok)"}">${was?"是":"否"}</td></tr>`).join("")}</tbody>
      </table></div>
      <div class="tbl-wrap" style="margin-top:12px"><table>
        <thead><tr><th class="lab">量</th><th>无噪声参考</th><th>重复均值 (R=${req.repeats})</th><th>样本方差/均方</th></tr></thead>
        <tbody>
          <tr><td class="lab">聚合更新向量</td><td class="vec">${fmtVec(L.ref_agg)}</td><td class="vec">—</td><td class="vec">${fmtVec(L.var_final)}</td></tr>
          <tr><td class="lab">聚合范数 ‖agg‖</td><td>${fmt(L.ref_agg_norm)}</td><td>${fmt(L.mean_agg_norm)}</td><td>var=${fmt(L.var_agg_norm)}</td></tr>
          <tr><td class="lab">缩放系数 s</td><td>${fmt(L.ref_scale)} <span class="pill">${L.ref_scale_source}</span></td><td>${fmt(L.mean_scale)}</td><td>var=${fmt(L.var_scale)}</td></tr>
          <tr><td class="lab">最终更新 s·agg</td><td class="vec">${fmtVec(L.ref_final)}</td><td class="vec">${fmtVec(L.mean_final)}</td><td>逐坐标方差↑</td></tr>
        </tbody>
      </table></div>
      <div style="margin-top:10px">
        <span class="kpi">参数范数 <b>${fmt(L.param_norm)}</b></span>
        <span class="kpi">偏差范数 ‖mean−ref‖ <b>${fmt(L.bias_norm)}</b></span>
        <span class="kpi">MSE <b>${fmt(L.mse)}</b></span>
        <span class="kpi">RMSE <b>${fmt(L.rmse)}</b></span>
        <span class="kpi">相对误差 <b>${fmt(L.rel_error)}</b></span>
      </div>`;
    host.appendChild(div);
  });
}

let timer = null;
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(runCompute, 180);
}

function renderAll() { renderLayers(); renderClients(); }

$("addLayer").onclick = () => {
  const i = state.layers.length;
  state.layers.push({name: "L" + (i+1), dim: 1, params: [0]});
  state.clients.forEach(c => c.updates.push([0]));
  renderAll(); schedule();
};
$("addClient").onclick = () => {
  state.clients.push({updates: state.layers.map(L => Array(L.dim).fill(0))});
  renderClients(); schedule();
};
["seed","noiseStd","repeats","budget","allocMode","scaleCap","scaleFallback"].forEach(id =>
  $(id).addEventListener("input", schedule));

renderAll();
runCompute();
</script>
</body>
</html>
